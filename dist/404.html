<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found · Autarkeia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090e'/%3E%3Cpath d='M6 25 16 6l10 19M11 19h10' fill='none' stroke='%23dfbda0' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090e;
      --ink: #f0eeeb;
      --muted: #93929f;
      --line: #ffffff19;
      --accent: #e6bea0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    .ambient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #4a2d5433, transparent 60%),
                  radial-gradient(circle at 20% 80%, #2b395222, transparent 50%);
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 580px;
    }
    .brand-mark {
      font-size: 42px;
      color: var(--accent);
      margin-bottom: 20px;
      display: inline-block;
    }
    .code {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(64px, 12vw, 120px);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff, #a59fb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--ink);
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--accent);
      color: #21170f;
      padding: 14px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all .25s ease;
    }
    .btn:hover {
      background: #f5d6bd;
      transform: translateY(-2px);
    }
    .countdown {
      margin-top: 24px;
      font-size: 12px;
      color: #6d6878;
    }
  </style>
  <script>
    // GitHub Pages SPA redirect / fallback
    const path = window.location.pathname;
    let base = window.location.origin;
    // Check if hosted under a subpath like /web/
    const repoMatch = path.match(/^\/([^/]+)/);
    const repoName = (repoMatch && repoMatch[1] !== 'dist' && repoMatch[1] !== 'index.html') ? '/' + repoMatch[1] + '/' : '/';
    
    let seconds = 4;
    function tick() {
      const el = document.getElementById('sec');
      if (el) el.textContent = seconds;
      if (seconds <= 0) {
        window.location.href = repoName;
      } else {
        seconds--;
        setTimeout(tick, 1000);
      }
    }
    window.addEventListener('DOMContentLoaded', () => {
      const homeLink = document.getElementById('home-link');
      if (homeLink) homeLink.href = repoName;
      tick();
    });
  </script>
</head>
<body>
  <div class="ambient"></div>
  <div class="container">
    <div class="brand-mark">Λ</div>
    <div class="code">404</div>
    <h1>Form Not Found in This Dimension</h1>
    <p>The cosmic coordinates you requested do not exist or have moved into a different field.</p>
    <a id="home-link" class="btn" href="./">
      Enter the Field <span>↗</span>
    </a>
    <div class="countdown">
      Redirecting back in <span id="sec">4</span> seconds…
    </div>
  </div>
</body>
</html>
